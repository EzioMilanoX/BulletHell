name: CI

# lint: so pyflakes ("F" — import morto, variavel nunca usada, nome
# indefinido), sem instalar nada alem do proprio ruff — mais rapido, roda
# em paralelo.
#
# test: a suite pytest inteira (tests/) — headless, backends null da
# engine + driver SDL "dummy" (o conftest.py seta SDL_VIDEODRIVER/
# SDL_AUDIODRIVER antes do primeiro import do pygame). Roda em Linux
# mesmo o jogo sendo Windows-first: nada aqui abre janela de verdade, e o
# wheel da engine (wheels/*.whl) e "py3-none-any" (puro Python).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias (pygame-ce, numpy, wheel local da engine)
        run: |
          pip install -r requirements.txt
          pip install pytest
          pip install wheels/ouroboros_engine-*.whl

      - name: pytest
        run: pytest -q
