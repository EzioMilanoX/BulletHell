name: Release

# Publica uma Release toda vez que uma tag "v*.*.*" for empurrada:
# 1. confere que a tag bate com bullethell.__version__ e extrai as notas
#    da secao "## vX.Y.Z" do CHANGELOG.md (tools/release_notes.py) — tag
#    sem versao/notas correspondentes falha aqui, antes de buildar;
# 2. roda a suite pytest (headless) — tag em commit quebrado nao vira .exe;
# 3. builda o BulletHell.exe standalone (tools/build_exes.ps1, ver
#    INSTALL.md) e empacota num .zip;
# 4. cria a Release da tag com o .zip como asset e as notas do CHANGELOG.
#
# O repo-irmao OuroborosEngine nao existe neste runner — tanto o pytest
# quanto o build_exes.ps1 usam o wheel ja versionado em wheels/ (o script
# testa ..\OuroborosEngine, nao acha e pula o rebuild). Isso e o motivo
# de termos comitado o wheel em vez de so depender do repo-irmao.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confere a versao e extrai as notas do CHANGELOG
        shell: pwsh
        run: python tools/release_notes.py "${{ github.ref_name }}" release_notes.md

      - name: Testes (pytest, headless)
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install (Get-Item wheels\ouroboros_engine-*.whl).FullName
          python -m pytest -q

      - name: Builda o .exe (venv limpo + PyInstaller)
        shell: pwsh
        run: .\tools\build_exes.ps1

      - name: Empacota o .zip de release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item dist\BulletHell.exe staging\
          Compress-Archive -Path staging\* -DestinationPath "BulletHell-$tag-win64.zip"

      - name: Publica a Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "BulletHell-$tag-win64.zip" `
            --title "BulletHell $tag" `
            --notes-file release_notes.md
